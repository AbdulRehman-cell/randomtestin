name: Render Direct CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint HTML & Config Files
        run: |
          # Ensure index.html and essential config exist and are not empty
          test -s index.html
          test -s styles.css
          test -s nginx.conf

      - name: Build Docker Image Locally (Dry Run Validation)
        run: |
          docker build -t static-web-app:test .

  deploy:
    needs: test_and_lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Render
        # Trigger Render Deploy Hook if configured
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping auto-trigger."
            echo "Configure RENDER_DEPLOY_HOOK_URL in GitHub Repository Secrets to automate deployments."
          fi